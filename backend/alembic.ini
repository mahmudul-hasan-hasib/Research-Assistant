[alembic]
# Migrations live under backend/alembic. All schema changes are migrations (P10).
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url is resolved by alembic/env.py from the settings service.
# Override here only for ops/tests that must not touch the environment.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
